name: Scheduled Task
on:
    workflow_dispatch:
    
    schedule:
      - cron: '30 2 * * 1'
      - cron: '0 */6 * * *'
jobs:
    job:
        runs-on: ubuntu-latest
        steps:
            - name: Print which schedule triggered
              run : echo "triggered by:${{ github.event.schedule }}"

            - name: Health Check
              run: |
                response_code=$(curl -s -o /dev/null -w "%{http_code}" https://github.com/samsrajyt/90DaysOfDevOps)
                echo "HTTP Status: $response_code"

