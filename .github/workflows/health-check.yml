name: Health Check
on:
    workflow_dispatch:
        
    schedule:
        - cron: '0 */12 * * *'
jobs:
    healthcheck:
        runs-on: ubuntu-latest
        steps:
            - name: checkout Code
              uses: actions/checkout@v6

            - name: docker login
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}
            
            - name: pull image
              run: |
                docker pull ${{ secrets.DOCKER_USERNAME }}/flask-app-claude:latest

            - name: run the container
              run: |
                docker run -d -p 5000:5000  ${{ secrets.DOCKER_USERNAME }}/flask-app-claude:latest

            - name: Sleep
              run: |
                sleep 5
                pip install -r requirements.txt -r requirement-dev.txt
                pytest --cov=app --cov-report=term-missing

            - name: status check
              if: success()
              run: |
                echo "## Health Check Report" >> $GITHUB_STEP_SUMMARY
                echo "- Image: "${{ secrets.DOCKER_USERNAME }}/flask-app-claude:latest"" >> $GITHUB_STEP_SUMMARY
                echo "- Status: PASSED" >> $GITHUB_STEP_SUMMARY
                ehco "- Time: $(date)" >> $GITHUB_STEP_SUMMARY
            
            - name: failed status check
              if: failure()
              run:
                echo "Status check failed , please check if the app is down"



                

            