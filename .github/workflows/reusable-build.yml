name: Reusable Workflow
on:
    workflow_call:
        inputs:
            app_name:
                type: string
                required: true
            environment:
                type: string
                required: true
                default: staging
        secrets:
            docker_token:
                required: true
        outputs:
            build_version:
                value: ${{ jobs.job1.outputs.build_version }}
jobs:
    job1:
        runs-on: ubuntu-latest
        outputs: 
            build_version: ${{ steps.build_id.outputs.Build_version}}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: print info
              run: |
                echo "Build ${{inputs.app_name}} for ${{ inputs.environment }}"
            
            - name: Check for docker token
              run: |
                if [ -z ${{ secrets.docker_token}} ]; then
                  echo "Docker token is set: False"
                else
                  echo "Docker token is set: True"
                fi
            - name: generate build version
              id: build_id
              run: |
                echo "Build_version="v1.0-${{ github.sha }}"" >> $GITHUB_OUTPUT
            
