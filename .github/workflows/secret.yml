name: Secret Workflow
on:
    workflow_dispatch:

jobs:
    check-secret:
        runs-on: ubuntu-latest
        steps:
            - name: reading secret variable is set
              run: |
                if [ -z "${{ secrets.MY_SECRET_MESSAGE }}"" ]; then
                  echo "The secret is set: false"
                else
                  echo "The secret is set: true"
                  echo ${{ secrets.MY_SECRET_MESSAGE }}
                fi