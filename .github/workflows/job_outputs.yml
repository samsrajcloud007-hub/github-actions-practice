name: Outputs Workflow
on:
    workflow_dispatch:

jobs:
    date:
        runs-on: ubuntu-latest
        outputs: 
            date: ${{ steps.date.outputs.date }}
        steps:
            - name: print date
              id: date
              run: echo "date=$(date+"%y%m%d")" >> "$GITHUB_OUTPUT"

    print-date:
        runs-on: ubuntu-latest
        needs: date
        steps:
            - name: print date from date job
              run: |
                echo "date is ${{ needs.date.outputs.date }}"

        
        
            
    