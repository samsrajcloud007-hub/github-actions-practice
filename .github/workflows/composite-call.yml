name: Composite Action Caller
on:
    push:
        branches:
            - main


jobs:
    call-composite-action:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: call Composite action
              id: foo
              uses: ./.github/actions/setup-and-greet
              with:
                name: 'Sam'
                language: 'en'
              
            - run: |
                echo "${{ steps.foo.outputs.greeted }}" 

