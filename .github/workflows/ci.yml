name: CI Workflow
on:
    workflow_dispatch:

jobs:
    CI-Pipeline:
        runs-on: ubunutu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7
            
            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.12'
                cache: pip
            
            - name: install Dependancies
              run: |
                pip install -r requirements.txt
            
            - name: run the script
              run: |
                python app.py
            
            - name: Failure step
              if: failure()
              run: exit 1

              

