name: reusable docker build and push workflow
on:
    workflow_call:
        inputs:
            image_name:
                type: string
                required: true
            tag:
                type: string
                required: true
        secrets:
          docker_username:
            required: true
          docker_token: 
            required: true
        outputs:
            image_url:
                value: ${{ jobs.build-and-push.outputs.image_url }}
jobs:
    build-and-push:
        outputs:
            image_url: ${{ steps.image_id.outputs.image_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: login to docker
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.docker_username }}
                password: ${{ secrets.docker_token }}
            
            - name: build and push
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: |
                  ${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}
                  ${{ secrets.docker_username}}/${{ inputs.image_name }}:latest

            - name: generate image_url
              id: image_id
              run: |
                image_url=${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}
                echo "image_url=${image_url}" >> $GITHUB_OUTPUT
            