name: Multi Job
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Build App
              run: echo "Building the app"
    test:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Test
              run: echo "Running Tests"
    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Deploy
              run: echo "Deploying"